name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.11.0'
  PNPM_VERSION: '9.12.0'

jobs:
  quality:
    name: Lint / Typecheck / Format / Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm exec prisma generate

      - name: Build shared package (necessaire pour la resolution de types)
        run: pnpm --filter @cinepass/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test
        env:
          DATABASE_URL: 'file:./prisma/test.db'

      - name: Build
        run: pnpm build

  e2e:
    name: E2E Playwright
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @cinepass/e2e install-browsers

      - name: Setup database
        working-directory: apps/api
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed
        env:
          DATABASE_URL: 'file:./prisma/cinepass.db'

      - name: Build apps
        run: pnpm build

      - name: Start API in background
        working-directory: apps/api
        run: nohup pnpm start > ../../api.log 2>&1 &
        env:
          DATABASE_URL: 'file:./prisma/cinepass.db'
          PORT: '3001'

      - name: Start web preview in background
        working-directory: apps/web
        run: nohup pnpm preview --port 4321 --strictPort > ../../web.log 2>&1 &

      - name: Wait for servers
        run: |
          npx wait-on http://localhost:3001/api/health http://localhost:4321 -t 60000

      - name: Run Playwright tests
        working-directory: e2e
        run: pnpm test
        env:
          E2E_BASE_URL: 'http://localhost:4321'
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
