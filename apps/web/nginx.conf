server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Healthcheck Docker : public
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Cache long pour les assets immuables (Vite ajoute un hash dans le filename)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Endpoint dedie a la verif d'auth : toujours protege, force le popup browser
  # quand on visite directement /api/auth/me sans credentials.
  location = /api/auth/me {
    auth_basic "Cinepass - se connecter pour modifier";
    auth_basic_user_file /etc/nginx/.htpasswd;
    proxy_pass http://api:3001/api/auth/me;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API : GET public (lecture seule), autres methodes (PATCH/POST/DELETE/PUT) -> auth
  location /api/ {
    limit_except GET HEAD OPTIONS {
      auth_basic "Cinepass - modification reservee";
      auth_basic_user_file /etc/nginx/.htpasswd;
    }
    proxy_pass http://api:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Frontend SPA : public
  location / {
    try_files $uri $uri/ /index.html;
  }
}
