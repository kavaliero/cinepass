server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # HTTP Basic Auth (genere au boot par docker-entrypoint.sh depuis CINEPASS_USER/PASS)
  auth_basic "Cinepass - acces restreint";
  auth_basic_user_file /etc/nginx/.htpasswd;

  # Healthcheck Docker : doit rester public, sinon le orchestrator marque unhealthy.
  location = /healthz {
    auth_basic off;
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Cache long pour les assets immuables (Vite ajoute un hash dans le filename)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Proxy /api -> service api (auth_basic herite, l'api est donc protegee aussi)
  location /api/ {
    proxy_pass http://api:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Fallback SPA : toute route non matchee renvoie index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
